<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Konu Anlatımı · Ladin Ormanı</title>

<meta property="og:title" content="Konu Anlatımı · Ladin Ormanı">
<meta property="og:description" content="İlkokul için örnekle öğreten konu anlatımları: dil bilgisi ve matematik.">
<meta property="og:url" content="https://1siniflarzumresi.github.io/okumatreni/deneme/konu-anlatimi.html">

<style>
.baslik{padding:28px 0 8px}
.baslik h1{font-size:clamp(28px,5vw,42px);margin:0 0 6px}
.baslik p{margin:0;color:var(--soluk);max-width:720px}
.sekmeler{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 4px}
.sekme{font:inherit;font-weight:700;font-size:17px;display:inline-flex;align-items:center;gap:10px;border:2px solid var(--cizgi);background:#fff;border-radius:999px;padding:8px 20px 8px 8px;cursor:pointer;min-height:48px}
.sekme span{width:34px;height:34px;border-radius:50%;background:var(--mavi-a);color:var(--mavi);display:grid;place-items:center;font-size:15px}
.sekme[aria-pressed="true"]{border-color:var(--mavi);background:var(--mavi);color:#fff}.sekme[aria-pressed="true"] span{background:#fff}
.mk-dizi{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:8px}
.mk-kart{display:inline-flex;flex-direction:column;align-items:center;gap:2px;background:#fff;border:2px solid var(--cizgi);border-radius:12px;padding:6px 10px}.mk-kart b{font-size:15px;font-weight:700}
.mk-ok{font-size:16px;color:var(--soluk)}
.mm{background:var(--ga);border:2px solid var(--g);border-radius:8px;padding:0 6px;font-weight:700}
.mk-basamak{display:flex;gap:6px;margin-top:6px}.mk-basamak span{display:flex;flex-direction:column;align-items:center;min-width:64px;background:#fff;border:2px solid var(--g);border-radius:10px;font-size:28px;font-weight:700}.mk-basamak small{font-size:12px;color:var(--soluk)}
.mk-islem{font:700 26px/1.25 ui-monospace,Menlo,Consolas,monospace;background:#fff;border-radius:10px;padding:8px 16px;display:inline-block;margin:0 0 8px}
.mk-para{width:58px;height:58px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fff2c4,#e0b84a);border:2px solid #a0640a;display:grid;place-items:center;font-size:14px;font-weight:700}.mk-para.b{background:radial-gradient(circle at 35% 35%,#f1f1f1,#b9bec4);border-color:#6b7280}
.mk-kagit{width:78px;height:42px;border-radius:6px;background:linear-gradient(135deg,#d8f5e9,#9fd3ff);border:2px solid #1d4e89;display:grid;place-items:center;font-size:14px;font-weight:700}
.mk-tablo{border-collapse:collapse;background:#fff;font-size:18px}.mk-tablo th,.mk-tablo td{border:2px solid var(--cizgi);padding:4px 12px}.mk-tablo th{background:var(--ga)}
.dizin{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px;margin:20px 0 32px}
.dizin section{background:#fff;border-radius:18px;box-shadow:var(--golge);padding:16px 18px;border-top:5px solid var(--g)}
.dizin h2{font-size:16px;margin:0 0 8px;color:var(--g)}
.dizin ol{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:3px}
.dizin a{color:var(--yazi);text-decoration:none;font-weight:700}.dizin a:hover{color:var(--g);text-decoration:underline}
.dizin .s{font-size:12px;color:var(--soluk);font-weight:400;margin-left:4px}
.konular{display:flex;flex-direction:column;gap:28px;padding-bottom:40px}
.konu{background:#fff;border-radius:22px;box-shadow:var(--golge);overflow:hidden;scroll-margin-top:16px}
.konu-ust{display:flex;align-items:center;gap:14px;padding:18px 22px;background:var(--ga);border-bottom:1px solid var(--cizgi)}
.konu-ust .no{flex:none;width:44px;height:44px;border-radius:14px;background:var(--g);color:#fff;display:grid;place-items:center;font-weight:700;font-size:20px}
.konu-ust h3{margin:0;font-size:clamp(20px,3vw,26px)}
.konu-ust .sinif{margin-left:auto;font-size:13px;font-weight:700;color:var(--g);background:#fff;border-radius:999px;padding:4px 12px;white-space:nowrap}
.konu-ic{display:grid;grid-template-columns:1.2fr 1fr;gap:22px;padding:22px}
@media (max-width:820px){.konu-ic{grid-template-columns:1fr}}
.etiket{font-size:13px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--soluk);margin:0 0 8px}
.ornek{background:var(--zemin);border:2px dashed var(--cizgi);border-radius:16px;padding:16px 18px;font-size:clamp(19px,2.6vw,23px);line-height:1.7}
.ornek p{margin:0 0 6px}.ornek p:last-child{margin:0}
.kural ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:17px;line-height:1.55}
.dikkat{margin-top:14px;background:var(--sari-a);border-left:5px solid var(--sari);border-radius:12px;padding:12px 14px;font-size:16px;line-height:1.55}
.dikkat b{color:#a05a00}
.dene{grid-column:1/-1;border-top:1px solid var(--cizgi);padding-top:18px}
.dene p{font-size:18px;margin:0 0 10px;font-weight:700}
.secenek{display:flex;gap:10px;flex-wrap:wrap}
.secenek button{font:inherit;font-size:19px;border:2px solid var(--cizgi);background:#fff;border-radius:14px;padding:8px 18px;cursor:pointer;min-height:48px}
.secenek button:hover{border-color:var(--g)}
.secenek button.dogru{background:#e6faf2;border-color:#12b886;color:#0b7a58}
.secenek button.yanlis{background:#ffeef0;border-color:#f2546b;color:#b3261e}
.geri{margin-top:10px;font-size:16px;min-height:24px}
/* görsel yardımcılar */
.u{color:#f2546b;font-weight:700}
.vu{background:#fff3b0;border-radius:6px;padding:0 3px;font-weight:700}
.hece{display:inline-flex;gap:4px;margin:0 10px 6px 0;vertical-align:middle}
.hece>span{background:#fff;border:2px solid var(--g);border-radius:10px;padding:0 10px}
.alfabe{display:flex;flex-wrap:wrap;gap:6px}
.alfabe span{width:42px;height:46px;display:grid;place-items:center;border-radius:10px;background:#fff;border:2px solid var(--cizgi);font-weight:700}
.alfabe span.u{border-color:#f2546b;background:#ffeef0}
.isaret{display:inline-grid;place-items:center;min-width:30px;height:30px;border-radius:8px;background:var(--g);color:#fff;font-weight:700;margin:0 2px;padding:0 4px}
.mektup{background:#fff;border:2px solid var(--cizgi);border-radius:12px;padding:14px 18px;font-size:18px;line-height:1.6;position:relative}
.mektup .k{font-size:12px;font-weight:700;color:var(--g);background:var(--ga);border-radius:6px;padding:1px 6px;margin-left:8px;vertical-align:middle}
.yazdir{margin:6px 0 0}
@media print{.ust,.alt,.dizin,.dene,.yazdir{display:none}.konu{break-inside:avoid;box-shadow:none;border:1px solid #ccc;margin-bottom:12px}}
</style>
</head>
<body>
<header class="ust"><div class="kap">
  <a class="logo" href="index.html"><svg viewBox="0 0 34 40" aria-hidden="true"><path d="M17 2 26 13h-4l7 9h-5l7 10H3l7-10H5l7-9H8z" fill="#2e8b57"/><rect x="14.5" y="32" width="5" height="7" rx="1" fill="#c48a4f"/></svg>Ladin Ormanı</a>
  <nav aria-label="Ana menü"><a class="ders-l" href="index.html#turkce">Türkçe</a><a class="ders-l" href="index.html#matematik">Matematik</a><a class="ders-l" href="index.html#hayat_bilgisi">Hayat Bilgisi</a><a href="konu-anlatimi.html" aria-current="page">Konu Anlatımı</a><a class="ders-l" href="../oyunlar.html">Oyunlar</a><a href="takvim.html">Takvim</a><span class="ayrac-m"></span></nav><span id="uye-alani"></span>
</div></header>

<main class="kap">
  <div class="baslik">
    <h1>Konu Anlatımı</h1>
    <p id="aciklama"></p>
  </div>
  <div class="sekmeler" id="sekmeler"></div>
  <div class="dizin" id="dizin"></div>
  <div class="konular" id="konular"></div>
</main>

<footer class="alt"><div class="kap"><span>Ladin Ormanı · MEB Maarif Modeli'ne uygun materyaller</span><a href="kvkk.html">KVKK Aydınlatma Metni</a></div></footer>

<script src="ortak.js"></script>
<script type="module" src="uyelik.js"></script>
<script src="konu-dil.js"></script>
<script src="konu-mat.js"></script>
<script>
(function(){
  var SEKME = [["dil","Dil Bilgisi","Aa"],["mat","Matematik","12"]];
  var sek = document.getElementById("sekmeler"), dizin = document.getElementById("dizin"), konular = document.getElementById("konular"), aktif = null;
  sek.innerHTML = SEKME.map(function(s){ return '<button type="button" class="sekme" data-s="'+s[0]+'"><span>'+s[2]+'</span>'+s[1]+'</button>'; }).join("");
  function ciz(ad){
    var D = window.KONU[ad]; if (!D) return; aktif = D;
    sek.querySelectorAll(".sekme").forEach(function(b){ b.setAttribute("aria-pressed", b.dataset.s === ad); });
    document.getElementById("aciklama").textContent = D.aciklama;
    var dz = {}; D.K.forEach(function(k){ (dz[k.grup] = dz[k.grup] || []).push('<li><a href="#'+k.id+'">'+k.baslik+'</a><span class="s">'+k.sinif+'</span></li>'); });
    dizin.innerHTML = Object.keys(D.GRUP).filter(function(g){ return dz[g]; }).map(function(g){
      return '<section style="--g:'+D.GRUP[g].g+'"><h2>'+D.GRUP[g].ad+'</h2><ol>'+dz[g].join("")+'</ol></section>'; }).join("");
    konular.innerHTML = D.K.map(function(k, i){
      var G = D.GRUP[k.grup];
      return '<article class="konu" id="'+k.id+'" style="--g:'+G.g+';--ga:'+G.ga+'">'+
        '<div class="konu-ust"><span class="no">'+(i+1)+'</span><h3>'+k.baslik+'</h3><span class="sinif">'+k.sinif+'</span></div>'+
        '<div class="konu-ic"><div><p class="etiket">Örnekle başlayalım</p><div class="ornek">'+k.ornek+'</div></div>'+
        '<div class="kural"><p class="etiket">Kural</p><ul>'+k.kural.map(function(x){ return "<li>"+x+"</li>"; }).join("")+'</ul><div class="dikkat">'+k.dikkat+'</div></div>'+
        '<div class="dene"><p>Kendin dene: '+k.dene.s+'</p><div class="secenek">'+k.dene.c.map(function(c, j){ return '<button type="button" data-j="'+j+'">'+c+'</button>'; }).join("")+'</div><div class="geri" aria-live="polite"></div></div>'+
        '</div></article>';
    }).join("");
  }
  sek.addEventListener("click", function(e){ var b = e.target.closest(".sekme"); if (b) { history.replaceState(null, "", "#" + b.dataset.s); ciz(b.dataset.s); } });
  konular.addEventListener("click", function(e){
    var b = e.target.closest(".secenek button"); if (!b) return;
    var art = b.closest(".konu"), k = aktif.K.filter(function(x){ return x.id === art.id; })[0], dogru = +b.dataset.j === k.dene.d;
    b.classList.add(dogru ? "dogru" : "yanlis");
    art.querySelector(".geri").innerHTML = dogru ? "✔ Aferin! " + k.dene.a : "Bir daha dene. Örneğe tekrar bak.";
  });
  // #dil, #mat ya da bir konunun kimliği (#hece, #toplama)
  function hashAc(){
    var h = location.hash.slice(1);
    if (window.KONU[h]) return ciz(h);
    var sahip = Object.keys(window.KONU).filter(function(d){ return window.KONU[d].K.some(function(k){ return k.id === h; }); })[0];
    ciz(sahip || "dil");
    if (sahip) { var el = document.getElementById(h); if (el) el.scrollIntoView(); }
  }
  hashAc();
})();
</script>
</body>
