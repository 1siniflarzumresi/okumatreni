:root{--navy:#1E2464;--red:#E3051B;--bg:#F2F4FA}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--navy)}
.bar{background:var(--navy);color:#fff;display:flex;align-items:center;gap:10px;padding:10px 16px}
.back{color:#fff;text-decoration:none;font-weight:600;font-size:15px;padding:8px 14px;border-radius:999px;background:rgba(255,255,255,.14);white-space:nowrap}
.wait{text-align:center;font-family:TTKB;font-weight:700;font-size:34px;padding:50px 10px}
.bar h1{font-family:TTKB;font-weight:700;font-size:26px;margin:0;flex:1}
.stars{font-size:28px;letter-spacing:4px;color:#C9CEE3}.stars .on{color:#F9C74F}
.wrap{max-width:1100px;margin:0 auto;padding:14px 16px 30px}
.sheet{background:#fff;border:4px solid var(--navy);border-radius:26px;padding:18px 22px;position:relative}
.ladders{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px 28px}
.lad{display:flex;flex-direction:column;gap:2px}
.lad.r{align-items:flex-end;text-align:right}
.ln{width:max-content;font-family:TTKB;font-weight:700;font-size:var(--fs,34px);line-height:1.25;padding:2px 10px;border-radius:12px;transition:background .25s,opacity .25s;white-space:nowrap}
.ln b{color:var(--red);font-weight:700}
.ln.now{background:#FFE36E;box-shadow:0 0 0 3px #F6B800 inset}
.ln.done{opacity:.45}
.pic{display:flex;justify-content:space-around;align-items:center;margin:6px 0 4px}
.pic svg{width:min(240px,40vw);height:auto}
.ctl{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:16px}
.btn{font:inherit;font-weight:700;font-size:20px;border:0;border-radius:999px;padding:14px 26px;cursor:pointer;background:#2E9256;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.btn.alt{background:#fff;color:var(--navy);border:3px solid var(--navy)}
.spd{display:flex;gap:8px;background:#fff;border-radius:999px;padding:6px;border:3px solid #D8DDED}
.spd button{font:inherit;font-size:30px;border:0;background:transparent;border-radius:999px;padding:4px 12px;cursor:pointer;opacity:.45}
.spd button.on{opacity:1;background:#FFF3C4}
.note{text-align:center;font-size:15px;color:#575E80;margin-top:10px}
@media (max-width:700px){.ladders{grid-template-columns:minmax(0,1fr)}.lad.r{align-items:flex-start;text-align:left}}

.tabs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:0 0 14px}
.tabs button{font-family:TTKB;font-weight:700;font-size:26px;min-width:62px;border:3px solid #D8DDED;background:#fff;color:var(--navy);border-radius:16px;padding:4px 10px;cursor:pointer}
.tabs button.on{border-color:var(--red);background:#FFF0F0}
.tabs button small{display:block;font-family:system-ui;font-size:11px;color:#F6B800;letter-spacing:1px;min-height:13px}

.sets{display:flex;gap:8px;justify-content:center;margin:-4px 0 12px}
.sets button{font:inherit;font-weight:700;font-size:18px;border:3px solid #D8DDED;background:#fff;color:var(--navy);border-radius:999px;padding:6px 18px;cursor:pointer}
.sets button.on{border-color:#2E9256;background:#E8F7E4}
.story{display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.story .ln{white-space:normal;width:auto;max-width:100%}
.single{display:flex;justify-content:center}

ek al.", "Tuna, Utku ile kutu kutu kek al."]], [["Kutla.", "Okulu kutla.", "Tuna, okulu kutla.", "Tuna, Utku ile okulu kutla.", "Tuna, Utku ile okulu el ele kutla!"], ["Tutkal.", "Tutkal al.", "Utku, tutkal al.", "Utku, kutu kutu tutkal al.", "Utku, Tuna ile on kutu tutkal al."]]], "story": null}, "R": {"sets": [[["Tren.", "Tren kalkar.", "Tren erken kalkar.", "Eren, tren erken kalkar.", "Eren, Rana, tren erken kalkar!"], ["Erik.", "Erik al.", "Rana, erik al.", "Rana, Eren ile erik al.", "Rana, Eren ile on kutu erik al!"]], [["Kar.", "Kar erir.", "Karlar erir.", "Karlar tane tane erir."], ["Konar.", "Kartal konar.", "Kartal kulelere konar.", "Kartal, tek tek kulelere konar."]]], "story": ["Eren ile Rana erken kalkar.", "Tren kalkar.", "Tren, tarla tarla ilerler.", "Karlar tane tane erir.", "Kartal, kulelere konar."]}, "I": {"sets": [[["Arı.", "Arı arar.", "Arı, nar arar.", "Arı, kırk nar arar.", "Arı, tarla tarla kırk nar arar!"], ["Tırtıl.", "Tırtıl takla atar.", "Tırtıl kırk takla atar.", "Tırtıl kırk kere takla atar.", "Tırtıl, Kaan ile kırk kere takla atar!"]], [["Kır.", "Kırlar.", "Kırlar ılık.", "Kırlar, tarlalar ılık.", "Kırlar, tarlalar artık ılık."], ["Kırk.", "Kırk arı.", "Kırk arı, kırk tırtıl.", "Kırk arı, kırk tırtıl tarla tarla ilerler."]]], "story": ["Kırlar artık ılık.", "Arı, nar arar.", "Tırtıl takla atar.", "Kırk arı, kırk tırtıl tarla tarla ilerler."]}, "M": {"sets": [[["Elma.", "Elma al.", "Mert, elma al.", "Mert, Melek ile elma al.", "Mert, Melek ile minik minik elma al!"], ["Limonata.", "Limonata al.", "Umut, limonata al.", "Umut, Emre ile limonata al.", "Umut, Emre ile on tane limonata al!"]], [["Mum.", "Mor mum.", "Minik mor mum.", "Melek, minik mor mum al.", "Melek, Mert ile minik mor mum al!"], ["Mutlu.", "Mutlu ol.", "Melek, mutlu ol.", "Melek, Mert ile mutlu ol.", "Melek, Mert ile el ele mutlu ol!"]]], "story": ["Melek ile Mert markette.", "Melek, mor mum alır.", "Mert, elma ile limon alır.", "Anne: Limonata tatlı mı?", "Mert: Tamam, limonata tatlı!"]}};
const LOW = {'İ': 'i', 'I': 'ı'};
const lowL = L => LOW[L] || L.toLocaleLowerCase('tr-TR');
// harf yolundan gelir: ?harfler=aneti… → yalnız öğretilmiş harflerin sekmeleri görünür, son öğrenilen harf açılır
const Q = new URLSearchParams(location.search).get('harfler') || '';
const KEYS = Q ? Object.keys(DATA).filter(L => Q.includes(lowL(L))) : Object.keys(DATA);
let CUR = 'N', SET = 0, rows = [], SP = 1.25, i = -1, tm = null, run = false, paused = false;
const key = () => 'ak_' + CUR + '_' + SET;
const getS = k => { try { return Math.min(3, +(localStorage.getItem(k) || 0)); } catch(e) { return 0; } };
const letterStars = L => { const d = DATA[L], n = d.sets.length + (d.story ? 1 : 0); let s = 0; for (let j = 0; j < n; j++) s += getS('ak_' + L + '_' + j); return Math.floor(s / n); };
function tabs(){ document.getElementById('tabs').innerHTML = KEYS.map(L => `<button data-l="${L}" class="${L === CUR ? 'on' : ''}">${L}${lowL(L)}<small>${'★'.repeat(letterStars(L))}</small></button>`).join(''); }
function setsBar(){ const d = DATA[CUR], n = d.sets.length;
  document.getElementById('sets').innerHTML = (n > 1 || d.story) ? [...d.sets.map((_, j) => `<button data-s="${j}" class="${SET === j ? 'on' : ''}">${j + 1}. merdiven</button>`), d.story ? `<button data-s="${n}" class="${SET === n ? 'on' : ''}">📖 Hikâye</button>` : ''].join('') : ''; }
function drawStars(){ const n = getS(key()); document.querySelectorAll('#stars span').forEach((s, j) => s.classList.toggle('on', j < n)); }
function show(L, S){
  clearTimeout(tm); run = false; paused = false; i = -1; CUR = L; SET = S || 0; rows = [];
  document.getElementById('ttl').textContent = 'Akıcı Okuma · ' + L + lowL(L);
  const d = DATA[L], story = SET === d.sets.length, T = [L, lowL(L)], mark = s => [...s].map(c => T.includes(c) ? `<b>${c}</b>` : c).join('');
  const add = (el, t) => { const x = document.createElement('div'); x.className = 'ln'; x.innerHTML = mark(t); el.appendChild(x); rows.push({el: x, t}); };
  const L1 = document.getElementById('L1'), L2 = document.getElementById('L2'); L1.innerHTML = ''; L2.innerHTML = '';
  const lads = document.getElementById('lads');
  if (story) { lads.className = 'ladders single'; L1.className = 'lad story'; L2.style.display = 'none'; d.story.forEach(t => add(L1, t));
    document.getElementById('P1').innerHTML = STORYPIC[L]; document.getElementById('P2').style.display = 'none'; }
  else { lads.className = 'ladders'; L1.className = 'lad'; L2.style.display = ''; document.getElementById('P2').style.display = '';
    const both = a => [...a, ...a.slice(0, -1).reverse()], set = d.sets[SET];
    both(set[0]).forEach(t => add(L1, t)); both(set[1]).forEach(t => add(L2, t));
    const P = SET === 0 ? PICS[L] : PICS2[L]; document.getElementById('P1').innerHTML = P[0]; document.getElementById('P2').innerHTML = P[1]; }
  document.getElementById('go').textContent = '▶ Oku'; tabs(); setsBar(); drawStars(); fit();
}
function fit(){ const box = document.querySelector('.ladders'); let f = 42; box.style.setProperty('--fs', f + 'px');
  if (box.classList.contains('single')) { box.style.setProperty('--fs', Math.min(40, Math.max(22, innerWidth / 22)) + 'px'); return; }
  for (let g = 0; g < 30 && f > 15 && [...document.querySelectorAll('.lad')].some(l => [...l.children].some(c => c.getBoundingClientRect().width > l.clientWidth + 1)); g++) { f -= 1; box.style.setProperty('--fs', f + 'px'); } }
addEventListener('resize', fit);
const syl = s => (s.match(/[aeıioöuüAEIİOÖUÜ]/g) || []).length;
function step(){
  if (i >= 0) { rows[i].el.classList.remove('now'); rows[i].el.classList.add('done'); }
  i++;
  if (i >= rows.length) { run = false; document.getElementById('go').textContent = '▶ Bir daha oku';
    try { localStorage.setItem(key(), Math.min(3, getS(key()) + 1)); } catch(e) {} drawStars(); tabs(); return; }
  const r = rows[i]; r.el.classList.add('now'); r.el.scrollIntoView({block: 'nearest', behavior: 'smooth'});
  tm = setTimeout(step, Math.max(900, syl(r.t) * SP * 550 + 700));
}
document.getElementById('tabs').onclick = e => { const b = e.target.closest('button'); if (b) show(b.dataset.l, 0); };
document.getElementById('sets').onclick = e => { const b = e.target.closest('button'); if (b) show(CUR, +b.dataset.s); };
document.getElementById('spd').onclick = e => { const b = e.target.closest('button'); if (!b) return; SP = +b.dataset.s; document.querySelectorAll('#spd button').forEach(x => x.classList.toggle('on', x === b)); };
document.getElementById('go').onclick = () => { if (run) return; run = true; paused = false; i = -1; rows.forEach(r => r.el.classList.remove('now', 'done')); document.getElementById('go').textContent = '…'; step(); };
document.getElementById('lads').onclick = () => { if (!run) return; if (paused) { paused = false; step(); } else { paused = true; clearTimeout(tm); } };
if (KEYS.length) show(KEYS[KEYS.length - 1], 0);
else { document.querySelector('.sheet').innerHTML = '<div class="wait">Akıcı okuma Nn harfiyle başlıyor.</div>'; document.getElementById('stars').style.display = 'none'; }
</script></body></html>
