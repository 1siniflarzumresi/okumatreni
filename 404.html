<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sayfa bulunamadı</title>
<meta name="robots" content="noindex">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f5f8f1;color:#22312a;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.5;text-align:center}
main{max-width:460px}
svg{width:72px;height:84px}
h1{font-size:28px;margin:12px 0 6px;color:#1f4d36}
p{margin:0 0 20px;color:#56675d}
a{display:inline-flex;align-items:center;min-height:44px;padding:10px 20px;border-radius:999px;background:#2e6b4a;color:#fff;font-weight:700;text-decoration:none}
a:focus-visible{outline:3px solid #f2b94b;outline-offset:2px}
@media (prefers-color-scheme:dark){body{background:#121b16;color:#e6efe7}h1{color:#9fd4ad}p{color:#a8b8ad}}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 34 40" aria-hidden="true"><path d="M17 2 26 13h-4l7 9h-5l7 10H3l7-10H5l7-9H8z" fill="#2e6b4a"/><path d="M17 2 26 13h-4l7 9h-5l7 10H17z" fill="#1f4d36"/><rect x="14.5" y="32" width="5" height="7" rx="1" fill="#8e5b2b"/></svg>
  <h1>Sayfa bulunamadı</h1>
  <p>Aradığınız sayfa taşınmış ya da adresi yanlış yazılmış olabilir.</p>
  <a id="don" href="/okumatreni/">Ana sayfaya dön</a>
</main>
<script>
// Adres "deneme/" altındaysa Ladin Ormanı ana sayfasına, değilse sitenin köküne döner.
(function(){
  var p = location.pathname, i = p.indexOf("/deneme/");
  var kok = p.indexOf("/okumatreni/") === 0 ? "/okumatreni/" : "/";
  document.getElementById("don").href = i >= 0 ? p.slice(0, i) + "/deneme/" : kok;
})();
</script>
</body>
</html>
